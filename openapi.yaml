          description: 'Whether the item participates in the ship/station resource network.'
          type: boolean
          example: true
          nullable: true
        is_relay:
          description: 'True when the item acts as a relay node.'
          type: boolean
          example: false
          nullable: true
        default_priority:
          description: 'Processing priority within the network (higher runs earlier). Commonly 50; fuel tanks use 100.'
          type: integer
          example: 50
          nullable: true
        states:
          description: 'List of available network states and their resource deltas.'
          type: array
          items:
            $ref: '#/components/schemas/resource_network_state'
          nullable: true
      type: object
