components:
  schemas:
    filter_value:
      title: 'Filter Value'
      description: 'A value available for filtering along with a human label and result count.'
      properties:
        value:
          nullable: true
          oneOf:
            -
              type: string
            -
              type: integer
            -
              type: boolean
        label:
          type: string
        count:
          type: integer
      type: object
    item_description_data:
      title: 'Item Description Data'
      description: 'Data found in the description of an item, e.g. "Carrying Capacity: 2kµSCU".'
      properties:
        name:
          type: string
        value:
          type: string
        type:
          description: 'Deprecated: Use "value" key.'
          type: string
          deprecated: true
      type: object
    item_dimension:
      title: 'Item Dimension'
      description: 'Dimensions of an item, generated from inventoryOccupancyDimensions or inventoryOccupancyDimensionsUIOverride in AttachDef.'
      properties:
        width:
          description: 'Width in meters, either from "DimensionOverrides" or "Dimension".'
          type: number
          format: double
          example: 0.52
          nullable: true
        height:
          description: 'Height in meters, either from "DimensionOverrides" or "Dimension".'
          type: number
          format: double
          example: 0.18
          nullable: true
        length:
          description: 'Length in meters, either from "DimensionOverrides" or "Dimension".'
          type: number
          format: double
          example: 1.12
          nullable: true
        volume:
          description: 'Cubic volume derived from the true dimensions (SCU).'
          type: number
          format: double
          example: 0.11
          nullable: true
        true_dimension:
          description: 'Raw dimensions from the game data in meters prior to overrides. Added only when the UI values differ from the canonical measurements.'
          properties:
            width:
              description: 'Original width pulled directly from the unmodified item definition (meters).'
              type: number
              format: double
              example: 0.5
              nullable: true
            height:
              description: 'Original height pulled directly from the unmodified item definition (meters).'
              type: number
              format: double
              example: 0.2
              nullable: true
            length:
              description: 'Original length pulled directly from the unmodified item definition (meters).'
              type: number
              format: double
              example: 1.1
              nullable: true
          type: object
          example:
            width: 0.5
            height: 0.2
            length: 1.1
          nullable: true
      type: object
    item_distortion:
      title: 'Item Distortion'
      description: 'Distortion information from stdItem.Distortion.'
      properties:
        decay_rate:
          type: number
          format: double
          nullable: true
        decay_delay:
          type: number
          format: double
          nullable: true
        maximum:
          type: number
          format: double
          nullable: true
        overload_ratio:
          description: 'Deprecated, does not exist anymore.'
          type: number
          format: double
          nullable: true
          deprecated: true
        warning_ratio:
          type: number
          format: double
          nullable: true
        recovery_ratio:
          type: number
          format: double
          nullable: true
        recovery_time:
          description: 'Deprecated, does not exist anymore.'
          type: number
          format: double
          nullable: true
          deprecated: true
        power_ratio_at_max_distortion:
          type: number
          format: double
          nullable: true
        power_change_only_at_max_distortion:
          type: integer
          nullable: true
        shutdown_time:
          type: number
          format: double
          nullable: true
      type: object
    item_durability:
      title: 'Item Durability'
      description: 'Durability information of an item, generated from SHealthComponentParams (health, repairable, salvageable) and SWearAccumulatorParams (max_lifetime).'
      properties:
        health:
          description: SHealthComponentParams@Health
          type: number
          format: double
          nullable: true
        max_lifetime:
          description: 'MaxLifetimeHours attribute on SWearAccumulatorParams'
          type: number
          format: double
          nullable: true
        repairable:
          description: SHealthComponentParams@IsRepairable
          type: boolean
        salvageable:
          description: SHealthComponentParams@IsSalvagable
          type: boolean
      type: object
    item_heat_connection:
      title: 'Item Heat Connection'
      description: 'Heat connection information, generated from EntityComponentHeatConnection attributes.'
      properties:
        temperature_to_ir:
          type: number
          format: double
          nullable: true
        ir_temperature_threshold:
          description: StartIRTemperature
          type: number
          format: double
          nullable: true
        overpower_heat:
          type: number
          format: double
          nullable: true
        overclock_threshold_min:
          type: number
          format: double
          nullable: true
        overclock_threshold_max:
          type: number
          format: double
          nullable: true
        thermal_energy_base:
          type: number
          format: double
          nullable: true
        thermal_energy_draw:
          type: number
          format: double
          nullable: true
        thermal_conductivity:
          type: number
          format: double
          nullable: true
        specific_heat_capacity:
          type: number
          format: double
          nullable: true
        mass:
          type: number
          format: double
          nullable: true
        surface_area:
          type: number
          format: double
          nullable: true
        start_cooling_temperature:
          type: number
          format: double
          nullable: true
        max_cooling_rate:
          type: number
          format: double
          nullable: true
        max_temperature:
          type: number
          format: double
          nullable: true
        min_temperature:
          type: number
          format: double
          nullable: true
        overheat_temperature:
          type: number
          format: double
          nullable: true
        recovery_temperature:
          type: number
          format: double
          nullable: true
        misfire_min_temperature:
          type: number
          format: double
          nullable: true
        misfire_max_temperature:
          type: number
          format: double
          nullable: true
        ir_emission:
          description: '(StartCoolingTemperature - StartIRTemperature) * TemperatureToIR'
          type: number
          format: double
          nullable: true
      type: object
    item_inventory:
      title: 'Item Inventory'
      description: 'Container (Inventory) of an item, resolved from SCItemInventoryContainerComponentParams'
      properties:
        uuid:
          description: 'Value of containerParams'
          type: string
          nullable: true
        width:
          description: interiorDimensions@x
          type: number
          format: double
          nullable: true
        height:
          description: interiorDimensions@z
          type: number
          format: double
          nullable: true
        length:
          description: interiorDimensions@y
          type: number
          format: double
          nullable: true
        volume:
          description: 'x*y*z'
          type: number
          format: double
          nullable: true
        scu:
          description: 'Amount of SCU this container can hold.'
          type: number
          format: double
          example: 0.002
          nullable: true
        scu_converted:
          description: 'SCU converted to referenced unit, e.g. 2000 (µSCU)'
          type: number
          format: double
          nullable: true
        unit:
          description: 'Unit as shown in the UI for example µSCU'
          type: string
          nullable: true
        open:
          description: IsOpenContainer
          type: boolean
          nullable: true
        external:
          description: IsExternalContainer
          type: boolean
          nullable: true
        closed:
          description: IsClosedContainer
          type: boolean
          nullable: true
      type: object
    item_link:
      title: 'Item Link'
      description: 'Link information to an Item'
      type: object
      allOf:
        -
          properties:
            uuid:
              type: string
            name:
              type: string
            class_name:
              type: string
              example: 987_jacket_03_01_04
            type:
              type: string
            sub_type:
              type: string
              nullable: true
            classification:
              type: string
              example: FPS.Clothing.Torso
              nullable: true
            is_base_variant:
              type: boolean
            manufacturer:
              $ref: '#/components/schemas/manufacturer_link'
            link:
              type: string
            base_variant:
              description: 'Link to base variant item'
              type: string
              nullable: true
            variants:
              type: array
              items:
                $ref: '#/components/schemas/item_link'
              nullable: true
          type: object
        -
          $ref: '#/components/schemas/metadata'
    item_port:
      title: 'Item Port'
      properties:
        name:
          type: string
        display_name:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
        sizes:
          properties:
            min:
              type: integer
              nullable: true
            max:
              type: integer
              nullable: true
          type: object
        compatible_types:
          type: array
          items:
            $ref: '#/components/schemas/item_port_type'
          nullable: true
        types:
          description: 'Raw type strings as provided by the game data'
          type: array
          items:
            type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        required_tags:
          type: array
          items:
            type: string
          nullable: true
        flags:
          description: 'Port flags from game data'
          type: array
          items:
            type: string
          nullable: true
        uneditable:
          description: 'Whether the port is locked'
          type: boolean
          nullable: true
        equipped_item_uuid:
          description: 'UUID of the equipped item'
          type: string
          nullable: true
        equipped_item:
          oneOf:
            -
              $ref: '#/components/schemas/item_link'
          nullable: true
      type: object
    item_port_type:
      title: 'Item Port Compatible Types'
      properties:
        type:
          type: string
          nullable: true
        sub_types:
          type: array
          items:
            type: string
          nullable: true
      type: object
    item_power_connection:
      title: 'Item Power Connection'
      description: 'Power connection information, generated from EntityComponentPowerConnection attributes.'
      properties:
        power_base:
          type: number
          format: double
          nullable: true
        power_draw:
          type: number
          format: double
          nullable: true
        throttleable:
          description: IsThrottleable
          type: boolean
          nullable: true
        overclockable:
          description: IsOverclockable
          type: boolean
          nullable: true
        overclock_threshold_min:
          type: number
          format: double
          nullable: true
        overclock_threshold_max:
          type: number
          format: double
          nullable: true
        overclock_performance:
          type: number
          format: double
          nullable: true
        overpower_performance:
          type: number
          format: double
          nullable: true
        power_to_em:
          type: number
          format: double
          nullable: true
        decay_rate_em:
          type: number
          format: double
          nullable: true
        em_min:
          description: 'PowerBase * PowerToEm. Use ResourceNetwork data instead.'
          type: number
          format: double
          nullable: true
        em_max:
          description: 'PowerDraw * PowerToEm. Use ResourceNetwork data instead.'
          type: number
          format: double
          nullable: true
      type: object
    game_item:
      title: Item
      description: 'An item in Star Citizen, based on EntityClassDefinition XML files.'
      properties:
        uuid:
          type: string
        name:
          type: string
        class_name:
          type: string
        classification:
          description: 'Not actually found in the game data, but generated by ScDataDumper.'
          type: string
          example: FPS.Clothing.Torso
        description:
          nullable: true
          oneOf:
            -
              type: string
            -
              type: array
              items:
                $ref: '#/components/schemas/translation'
        size:
          description: AttachDef@Size
          type: integer
          example: 1
          nullable: true
        mass:
          description: 'Generated from SEntityRigidPhysicsControllerParams'
          type: number
          format: double
          example: 1000
          nullable: true
        is_base_variant:
          type: boolean
        grade:
          type: string
          nullable: true
        class:
          type: string
