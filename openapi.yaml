            extraction_laser_power_percent:
              description: 'Multiplier on extraction beam power. Lower values mean slower extraction but often reduce inert material.'
              type: number
              format: double
              example: 95
              nullable: true
            optimal_charge_window_percent:
              description: 'Change to the size of the optimal (green) window. Positive widens, negative shrinks. Range seen: -10 to +40.'
              type: number
              format: double
              example: 40
              nullable: true
            optimal_charge_rate_percent:
              description: 'Change to the ideal charge rate speed. Higher values speed charging; negatives slow it. Range seen: -20 to +60.'
              type: number
              format: double
              example: 60
              nullable: true
            all_charge_rates_percent:
              description: 'Flat multiplier to all charge-rate bands when present. Range seen: +5 to +24.'
              type: number
