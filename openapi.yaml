            duration_seconds:
              description: 'Active duration per use in seconds. Observed range: 15–60.'
              type: number
              format: double
              example: 30
              nullable: true
          type: object
          nullable: true
        charges:
          description: 'Deprecated: use usage.charges.'
          type: integer
          example: 5
          nullable: true
          deprecated: true
        lifetime_seconds:
          description: 'Deprecated: use usage.lifetime_seconds.'
          type: number
          format: double
          example: 3600
