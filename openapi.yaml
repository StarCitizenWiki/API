    resource_network_delta:
      title: 'Resource Network Delta'
      description: 'Single resource change entry applied when a network state is active.'
      properties:
        type:
          description: 'Delta type (Consumption, Generation, Conversion, Storage, NetworkReflection).'
          type: string
          example: Consumption
          nullable: true
        resource:
          description: 'Target resource affected (Power, Fuel, Coolant, QuantumFuel, Shield, LifeSupport).'
          type: string
          example: Power
          nullable: true
        rate:
          description: 'Rate applied per tick (game native units). Typical power draw ~2–5; fuel draw often 0.01.'
          type: number
          format: double
          example: 2.2
          nullable: true
        minimum_fraction:
          description: 'Minimum fraction of the resource that must be available before the delta applies.'
          type: number
          format: double
          example: 0.25
          nullable: true
        generated_resource:
          description: 'Resource produced by conversion/storage deltas.'
          type: string
          example: Coolant
          nullable: true
        generated_rate:
          description: 'Rate of the generated resource.'
          type: number
          format: double
          example: 22
          nullable: true
        discharge:
          description: 'Whether stored resource is discharged (0/1 flag).'
          type: number
          format: double
          example: 0
          nullable: true
        no_over_generation:
          description: 'Prevents generating above capacity (0/1 flag).'
          type: number
          format: double
          example: 0
          nullable: true
        binary_evaluation:
          description: 'Binary reflection value for NetworkReflection deltas.'
          type: number
          format: double
          example: 1
          nullable: true
        composition:
          description: 'Optional composition entries describing how generated resource is assembled.'
          type: array
          items:
            properties:
              container_resource:
                type: string
                example: bcc8cde9-de58-4e6b-8ee9-37d4aaa507eb
                nullable: true
              ratio:
                type: number
                format: double
                example: 1
                nullable: true
            type: object
          nullable: true
      type: object
    resource_network_state:
      title: 'Resource Network State'
      description: 'Named state in the resource network with its signature and deltas.'
      properties:
        name:
          description: 'State name (e.g. Online). Can be empty on some items.'
          type: string
          example: Online
          nullable: true
        signature:
          description: 'Electromagnetic/infrared signature while in this state.'
          properties:
            em:
              type: number
              format: double
              example: 1490
              nullable: true
            ir:
              type: number
              format: double
              example: 7260
              nullable: true
          type: object
          nullable: true
        deltas:
          type: array
          items:
            $ref: '#/components/schemas/resource_network_delta'
          nullable: true
      type: object
    resource_network:
      title: 'Resource Network'
