openapi: 3.0.0
info:
  title: 'Star Citizen API'
  contact:
    email: foxftw@star-citizen.wiki
  version: 3.0.0
servers:
  -
    url: 'https://api.star-citizen.wiki'
paths:
  /api/items:
    get:
      tags:
        - In-Game
        - Items
      summary: 'In-Game Item Overview'
      description: 'Returns paginated in-game items for the requested category and version with optional filters/includes.'
      operationId: caa5b59cdee8fe4be0e7aba773065367
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
        -
          $ref: '#/components/parameters/include'
        -
          $ref: '#/components/parameters/sort'
        -
          name: 'filter[variants]'
          in: query
          schema:
            type: boolean
        -
          name: 'filter[type]'
          in: query
          schema:
            type: string
        -
          name: 'filter[sub_type]'
          in: query
          schema:
            type: string
        -
          name: 'filter[manufacturer]'
          in: query
          schema:
            type: string
        -
          name: 'filter[classification]'
          in: query
          schema:
            type: string
        -
          name: 'filter[size]'
          in: query
          schema:
            type: number
        -
          name: 'filter[grade]'
          in: query
          schema:
            type: number
        -
          name: 'filter[class]'
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'List of Items'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/game_item'
  '/api/items/{identifier}':
    get:
      tags:
        - In-Game
        - Items
      summary: 'In-Game Item Detail'
      description: 'Retrieve a specific item by name or UUID with metadata and includes.'
      operationId: cc74abcb9fb80ecbe534d6aea93df75c
      parameters:
        -
          $ref: '#/components/parameters/locale'
        -
          $ref: '#/components/parameters/include'
        -
          name: identifier
          in: path
          required: true
          schema:
            description: 'Item name or UUID'
            type: string
      responses:
        '200':
          description: 'An Item'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game_item'
  /api/items/search:
    post:
      tags:
        - In-Game
        - Items
        - Search
      summary: 'In-Game Item Search'
      description: 'Search items by title, manufacturer, or classification with optional filters.'
      operationId: 67e81b3a53d62afe9d3d713e391d6d05
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
        -
          $ref: '#/components/parameters/locale'
        -
          $ref: '#/components/parameters/include'
        -
          $ref: '#/components/parameters/sort'
        -
          name: 'filter[variants]'
          in: query
          schema:
            type: boolean
        -
          name: 'filter[type]'
          in: query
          schema:
            type: string
        -
          name: 'filter[sub_type]'
          in: query
          schema:
            type: string
        -
          name: 'filter[manufacturer]'
          in: query
          schema:
            type: string
        -
          name: 'filter[classification]'
          in: query
          schema:
            type: string
        -
          name: 'filter[size]'
          in: query
          schema:
            type: number
        -
          name: 'filter[grade]'
          in: query
          schema:
            type: number
        -
          name: 'filter[class]'
          in: query
          schema:
            type: string
      requestBody:
        description: 'Item Name or (sub)type'
        required: true
        content:
          application/json:
            schema:
              type: object
            example: '{"query": "Arrow"}'
      responses:
        '200':
          description: 'A List of matching Items'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/game_item'
  /api/items/filters:
    get:
      tags:
        - In-Game
        - Items
      summary: 'In-Game Item Filters'
      description: 'Return all available filter values for in-game items, grouped by field.'
      operationId: 8cd032a0b4591c3e203c00e9e5779194
      parameters:
        -
          name: version
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Available filters for in-game items.'
          content:
            application/json:
              schema:
                properties:
                  filters: { properties: { type: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, sub_type: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, classification: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, size: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, grade: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, class: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, manufacturer: { type: array, items: { $ref: '#/components/schemas/filter_value' } } }, type: object }
                type: object
  /api/manufacturers:
    get:
      tags:
        - In-Game
        - Manufacturers
      summary: 'In-Game Manufacturers Overview'
      description: 'Returns paginated manufacturers grouped by name with optional pagination.'
      operationId: 1f9d905a5e89dba1162f35428b92847c
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: 'List of Manufacturers'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/manufacturer_link'
  '/api/manufacturers/{manufacturer}':
    get:
      tags:
        - In-Game
        - Manufacturers
      summary: 'In-Game Manufacturer Detail'
      description: 'Retrieve a manufacturer by name, UUID, or code together with its products.'
      operationId: cba9b0f51268f6c1d4309aa573d37a9c
      parameters:
        -
          name: manufacturer
          in: path
          required: true
          schema:
            description: 'Manufacturer name, uuid, or code'
            type: string
      responses:
        '200':
          description: 'A Manufacturer and its products'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/manufacturer'
  /api/manufacturers/search:
    post:
      tags:
        - In-Game
        - Manufacturers
        - Search
      summary: 'In-Game Manufacturer Search'
      description: 'Search manufacturers by name, UUID, or code with optional pagination.'
      operationId: 26ff6a6dbd3785225cf297e83cc1b306
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
      requestBody:
        description: 'Manufacturer name, uuid, or code'
        required: true
        content:
          application/json:
            schema:
              type: object
            example: '{"query": "Anvil"}'
      responses:
        '200':
          description: 'A List of matching Manufacturers'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/manufacturer_link'
  /api/vehicles:
    get:
      tags:
        - In-Game
        - Vehicles
      summary: 'In-Game Vehicles Overview'
      description: 'Returns paginated in-game vehicles for the requested version and vehicle type with optional filters.'
      operationId: 64acf0fa3be1afd1fa9ee22c03f755bc
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
        -
          $ref: '#/components/parameters/include'
        -
          $ref: '#/components/parameters/sort'
        -
          name: 'filter[manufacturer]'
          in: query
          schema:
            type: string
        -
          name: 'filter[size]'
          in: query
          schema:
            type: integer
        -
          name: 'filter[career]'
          in: query
          schema:
            type: string
        -
          name: 'filter[role]'
          in: query
          schema:
            type: string
        -
          name: 'filter[is_vehicle]'
          in: query
          schema:
            type: boolean
        -
          name: 'filter[is_gravlev]'
          in: query
          schema:
            type: boolean
        -
          name: 'filter[is_spaceship]'
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 'List of Vehicles'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/game_vehicle'
  '/api/vehicles/{identifier}':
    get:
      tags:
        - In-Game
        - Vehicles
      summary: 'In-Game Vehicle Detail'
      description: 'Retrieve a vehicle by name, class name, or UUID along with requested includes.'
      operationId: 7bbede0623fe40dc123a58b51718a2c8
      parameters:
        -
          name: identifier
          in: path
          required: true
          schema:
            description: 'Vehicle name, class_name, or UUID'
            type: string
        -
          $ref: '#/components/parameters/include'
      responses:
        '200':
          description: 'A Vehicle'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/game_vehicle' }
                  - { $ref: '#/components/schemas/ship_matrix_vehicle' }
  /api/vehicles/search:
    post:
      tags:
        - In-Game
        - Vehicles
        - Search
      summary: 'In-Game Vehicle Search'
      description: 'Search vehicles by name, career, or identifier with optional filters and pagination.'
      operationId: e50aec74b72796ff0e51ce4bf5bf3a9e
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
        -
          $ref: '#/components/parameters/sort'
        -
          name: 'filter[manufacturer]'
          in: query
          schema:
            type: string
        -
          name: 'filter[size]'
          in: query
          schema:
            type: integer
        -
          name: 'filter[career]'
          in: query
          schema:
            type: string
        -
          name: 'filter[role]'
          in: query
          schema:
            type: string
        -
          name: 'filter[is_vehicle]'
          in: query
          schema:
            type: boolean
        -
          name: 'filter[is_gravlev]'
          in: query
          schema:
            type: boolean
        -
          name: 'filter[is_spaceship]'
          in: query
          schema:
            type: boolean
        -
          name: 'filter[focus]'
          in: query
          description: 'Filter by Ship-Matrix focus slug'
          schema:
            type: string
        -
          name: 'filter[type]'
          in: query
          description: 'Filter by Ship-Matrix type slug'
          schema:
            type: string
        -
          name: 'filter[production_status]'
          in: query
          description: 'Filter by Ship-Matrix production status slug'
          schema:
            type: string
      requestBody:
        description: 'Vehicle name, class_name, career, or UUID'
        required: true
        content:
          application/json:
            schema:
              type: object
            example: '{"query": "Avenger"}'
      responses:
        '200':
          description: 'A List of matching Vehicles'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/game_vehicle'
  /api/vehicles/filters:
    get:
      tags:
        - In-Game
        - Vehicles
      summary: 'In-Game Vehicle Filters'
      description: 'Return all available filter values for in-game vehicles.'
      operationId: 57e041d605c3ed0ffabeccf150c51a5e
      parameters:
        -
          name: version
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Available filters for in-game vehicles.'
          content:
            application/json:
              schema:
                properties:
                  filters: { properties: { manufacturer: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, is_vehicle: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, is_gravlev: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, is_spaceship: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, size: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, role: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, career: { type: array, items: { $ref: '#/components/schemas/filter_value' } } }, type: object }
                type: object
  /api/comm-links:
    get:
      tags:
        - Comm-Links
        - RSI-Website
      summary: 'Comm-Links Overview'
      description: 'Returns paginated comm-links with optional includes, categories, series, and channel filters.'
      operationId: 2204c384d22cb7168f6dd5830328c4dd
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
        -
          $ref: '#/components/parameters/comm_link_includes'
        -
          name: 'filter[channel]'
          in: query
          schema:
            type: string
        -
          name: 'filter[series]'
          in: query
          schema:
            type: string
        -
          name: 'filter[category]'
          in: query
          schema:
            type: string
        -
          name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'List of Comm-Links'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/comm_link'
  /api/comm-links/filters:
    get:
      tags:
        - Comm-Links
        - RSI-Website
      summary: 'Comm-Link Filters'
      description: 'Return all available filter values for Comm-Links.'
      operationId: 022b883a0bc1e7ae8691f000cb019a02
      responses:
        '200':
          description: 'Available filters for Comm-Links.'
          content:
            application/json:
              schema:
                properties:
                  filters: { properties: { category: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, channel: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, series: { type: array, items: { $ref: '#/components/schemas/filter_value' } } }, type: object }
                type: object
  '/api/comm-links/{id}':
    get:
      tags:
        - Comm-Links
        - RSI-Website
      summary: 'Comm-Link Detail'
      description: 'Retrieve a single comm-link by ID with the requested related resources.'
      operationId: 0f21f5e85cfa4d0fe0076f0d4a0d0ffd
      parameters:
        -
          $ref: '#/components/parameters/comm_link_includes'
        -
          name: id
          in: path
          required: true
          schema:
            description: 'Comm-Link ID, starting from 12663'
            type: integer
            format: int64
            minimum: 12663
      responses:
        '200':
          description: 'A singular Comm-Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/comm_link'
        '404':
          description: 'No Comm-Link with specified ID found.'
  /api/comm-links/search:
    post:
      tags:
        - Comm-Links
        - RSI-Website
      summary: 'Comm-Link Search'
      description: 'Query comm-links by title or ID with localized includes.'
      operationId: 2efd50e02ba871c509078dcf08701557
      parameters:
        -
          $ref: '#/components/parameters/locale'
      requestBody:
        description: '(Partial) Comm-Link Title or ID'
        required: true
        content:
          application/json:
            schema:
              type: object
            example: '{"query": "Banu Merchantman"}'
      responses:
        '200':
          description: 'A singular Comm-Link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/comm_link'
        '404':
          description: 'No Comm-Link with found.'
  /api/comm-links/reverse-image-link-search:
    post:
      tags:
        - Comm-Links
        - RSI-Website
        - Search
      summary: 'Comm-Link Reverse Image Link Search'
      description: 'Return comm-links that reference the same RSI-hosted image URL.'
      operationId: ae85fe68648858545fbb25b4733dcea8
      requestBody:
        description: 'Url to an image hosted on (media.)robertsspaceindustries.com'
        required: true
        content:
          application/json:
            schema:
              type: object
            example: '{"url": "https://robertsspaceindustries.com/i/cc75a45005a236c6e015dfc2782a2f55ed1e84a2/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiiucPBBDeyrBscqRyZz4qxNsSbWvqUwdG/alien-week-2022-front.webp"}'
      responses:
        '200':
          description: 'List of Comm-Links that use that image'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/comm_link_link'
        '404':
          description: 'No Comm-Link found.'
  /api/v2/comm-links/reverse-image-search:
    post:
      tags:
        - Comm-Links
        - RSI-Website
        - Search
      summary: 'Comm-Link Reverse Image Search'
      description: 'Search comm-links by uploading an image and specifying a similarity threshold.'
      operationId: 8bdf90ecd3e5006a622e7003282cc66b
      parameters:
        -
          name: similarity
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - image
              properties:
                image:
                  description: 'The image to reverse-search'
                  type: string
                  format: binary
              type: object
      responses:
        '200':
          description: 'List of Comm-Links that use that image'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/comm_link_link'
        '404':
          description: 'No Comm-Link found.'
  '/api/comm-link-images/{image}/similar':
    get:
      tags:
        - Comm-Links
        - RSI-Website
        - Search
      summary: 'Comm-Link Reverse Image Similar Search'
      description: 'Find Comm-Link images similar to an existing RSI-hosted image.'
      operationId: fade67e6a8c4629ba8554b85925c1148
      parameters:
        -
          name: image
          in: path
          required: true
          schema:
            type: integer
        -
          name: similarity
          in: query
          description: 'Threshold similarity percentage (defaults to 50)'
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: 'List of Comm-Link images that match the requested similarity'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/comm_link_link'
        '404':
          description: 'Comm-Link image not found.'
  /api/comm-link-images:
    get:
      tags:
        - Comm-Links
        - RSI-Website
        - Images
      summary: 'Comm-Link Images'
      description: 'List available comm-link images with pagination.'
      operationId: a705f668107b86178c6624b972dddefd
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: 'List of Comm-Link Images'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/comm_link_image'
  /api/comm-link-images/random:
    get:
      tags:
        - Comm-Links
        - RSI-Website
        - Images
      summary: 'Comm-Link Images Random'
      description: 'Retrieve random comm-link images, optionally filtered by tag.'
      operationId: 0b0b5e244ccfb0fe78f81d536ba99257
      parameters:
        -
          name: limit
          in: query
          schema:
            type: integer
            maximum: 100
        -
          name: 'filter[tags]'
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Retrieve a random Comm-Link Image. Limit parameter sets the number of random images'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/comm_link_image'
  /api/comm-link-images/search:
    post:
      tags:
        - Comm-Links
        - RSI-Website
        - Images
        - Search
      summary: 'Comm-Link Image Search by filename'
      description: 'Search comm-link images by filename with optional tag filtering.'
      operationId: dbd72b035105c4dcf17ee654931fe2ff
      parameters:
        -
          name: 'filter[tags]'
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Search for a Comm-Link Image by its filename.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/comm_link_image'
  /api/galactapedia:
    get:
      tags:
        - Galactapedia
        - RSI-Website
      summary: 'Galactapedia Overview'
      description: 'Return paginated Galactapedia articles with category, tag, and template filters.'
      operationId: 48f80f5118a6ef2670845b9dd1b90357
      parameters:
        -
          $ref: '#/components/parameters/page'
        -
          $ref: '#/components/parameters/page_number'
        -
          $ref: '#/components/parameters/page_size'
        -
          name: 'filter[category]'
          in: query
          schema:
            type: string
        -
          name: 'filter[categoryId]'
          in: query
          schema:
            type: string
        -
          name: 'filter[tag]'
          in: query
          schema:
            type: string
        -
          name: 'filter[tagId]'
          in: query
          schema:
            type: string
        -
          name: 'filter[template]'
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'List of Galactapedia Articles'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/galactapedia_article'
  /api/galactapedia/filters:
    get:
      tags:
        - Galactapedia
        - RSI-Website
      summary: 'Galactapedia Filters'
      description: 'Return all available filter values for Galactapedia articles.'
      operationId: 8087c05b7d87a42900d3c920dcaf1c6e
      responses:
        '200':
          description: 'Available filters for Galactapedia.'
          content:
            application/json:
              schema:
                properties:
                  filters: { properties: { category: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, tag: { type: array, items: { $ref: '#/components/schemas/filter_value' } }, template: { type: array, items: { $ref: '#/components/schemas/filter_value' } } }, type: object }
                type: object
  '/api/galactapedia/{id}':
    get:
      tags:
        - Galactapedia
        - RSI-Website
      summary: 'Galactapedia Article'
      description: 'Retrieve a Galactapedia article by ID with available includes and translations.'
      operationId: 541ad0798eef38797ca9a341b81eedac
      parameters:
        -
          $ref: '#/components/parameters/locale'
        -
          name: id
          in: path
          required: true
          schema:
            description: 'Galactapedia Article ID'
            type: string
        -
          name: include
          in: query
          explode: false
          allowReserved: true
          schema:
            description: 'Available Galactapedia includes'
            type: array
            items:
              type: string
              enum:
                - translations
                - tags
                - categories
                - related_articles
                - properties
      responses:
        '200':
          description: 'A singular Article'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/galactapedia_article'
        '404':
          description: 'No Article with specified ID found.'
  /api/galactapedia/search:
    post:
      tags:
        - Galactapedia
        - RSI-Website
        - Search
      summary: 'Galactapedia Article Search'
