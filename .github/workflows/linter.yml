name: Lint Code Base

on:
  push:
    branches: [ develop, "feature/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  super-linter:
    name: Super-Linter (non-PHP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Lint Code Base
        uses: super-linter/super-linter@v8.3.2
        env:
          DEFAULT_BRANCH: develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_INCLUDE: .*app/.*
          OUTPUT_FORMAT: tap
          VALIDATE_PHP_BUILTIN: false

  php-lint:
    name: PHP (Composer + Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
          extensions: gd, pdo, session, fileinfo, xml

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: ./vendor/bin/pint --test
