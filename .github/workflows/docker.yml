name: Docker Build

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

env:
  SKIP_BASELINE_SQLITE: 28
  SKIP_BASELINE_PGSQL: 18

jobs:
  laravel-test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
          clean: true

      - name: Installing PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: "8.5.1"
          extensions: gd

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache PHP dependencies
        uses: actions/cache@v5
        id: vendor-cache
        with:
          path: vendor
          key: "${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            ${{ runner.os }}-vendor-

      - name: Setup env file
        run: cp .env.ci .env

      - name: Composer install
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-ansi --no-interaction --no-scripts --no-suggest --prefer-dist

      - name: Setup keys
        run: php artisan key:generate

      - name: Fix perms for dirs
        run: chmod -R 777 storage bootstrap/cache

      - name: Migrate database
        env:
          DB_CONNECTION: "sqlite"
          DB_DATABASE: "db.sqlite"
        run: touch database/db.sqlite; php artisan migrate

      - name: Validate skip reason quality
        run: |
          php <<'PHP'
          <?php
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator('tests'));
          $violations = [];

          foreach ($iterator as $file) {
              if (! $file->isFile() || $file->getExtension() !== 'php') {
                  continue;
              }

              $path = $file->getPathname();
              $lines = file($path);

              if ($lines === false) {
                  continue;
              }

              foreach ($lines as $lineNumber => $line) {
                  if (! str_contains($line, '->skip(') && ! str_contains($line, 'markTestSkipped(')) {
                      continue;
                  }

                  if (! preg_match('/(?:->skip|markTestSkipped)\(\s*(?:[^,)]*,\s*)?([\'"])(.*?)\1\s*\)/', $line, $matches)) {
                      $violations[] = sprintf('%s:%d must use a literal human-readable skip reason.', $path, $lineNumber + 1);
                      continue;
                  }

                  if (mb_strlen(trim($matches[2])) < 20) {
                      $violations[] = sprintf('%s:%d skip reason must be at least 20 characters.', $path, $lineNumber + 1);
                  }
              }
          }

          if ($violations !== []) {
              fwrite(STDERR, "Skip reason quality check failed:\n".implode("\n", $violations)."\n");
              exit(1);
          }

          echo "Skip reason quality check passed.\n";
          PHP

      - name: Report quarantine tests
        run: |
          echo "Quarantine-tagged tests:"
          if ! grep -R -n -E "->group\\(['\"]quarantine['\"]\\)" tests --include='*.php'; then
            echo "None"
          fi

      - name: Execute tests via Pest
        env:
          DB_CONNECTION: "sqlite"
          DB_DATABASE: "db.sqlite"
        run: vendor/bin/pest --compact --log-junit junit-sqlite.xml

      - name: Gate skipped tests baseline
        env:
          SKIP_BASELINE: ${{ env.SKIP_BASELINE_SQLITE }}
        run: |
          php <<'PHP'
          <?php
          $junitPath = 'junit-sqlite.xml';
          $xml = simplexml_load_file($junitPath);

          if ($xml === false) {
              fwrite(STDERR, "Unable to read {$junitPath}\n");
              exit(1);
          }

          $skipped = count($xml->xpath('//testcase/skipped'));
          $baseline = (int) getenv('SKIP_BASELINE');

          echo "Skipped tests: {$skipped}; baseline: {$baseline}\n";

          if ($skipped > $baseline) {
              fwrite(STDERR, "Skip gate failed: skipped test count increased above baseline.\n");
              exit(1);
          }
          PHP

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-sqlite
          path: junit-sqlite.xml

  laravel-test-pgsql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: scw__api
          POSTGRES_USER: scw__api
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U scw__api"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
          clean: true

      - name: Installing PHP
        uses: shivammathur/setup-php@master
        with:
          php-version: "8.5.1"
          extensions: gd

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache PHP dependencies
        uses: actions/cache@v5
        id: vendor-cache
        with:
          path: vendor
          key: "${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}"
          restore-keys: |
            ${{ runner.os }}-vendor-

      - name: Setup env file
        run: cp .env.ci .env

      - name: Composer install
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-ansi --no-interaction --no-scripts --no-suggest --prefer-dist

      - name: Setup keys
        run: php artisan key:generate

      - name: Fix perms for dirs
        run: chmod -R 777 storage bootstrap/cache

      - name: Migrate database
        env:
          DB_CONNECTION: "pgsql"
          DB_DATABASE: "scw__api"
          DB_HOST: "127.0.0.1"
          DB_PORT: 5432
          DB_USERNAME: "scw__api"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: php artisan migrate

      - name: Validate skip reason quality
        run: |
          php <<'PHP'
          <?php
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator('tests'));
          $violations = [];

          foreach ($iterator as $file) {
              if (! $file->isFile() || $file->getExtension() !== 'php') {
                  continue;
              }

              $path = $file->getPathname();
              $lines = file($path);

              if ($lines === false) {
                  continue;
              }

              foreach ($lines as $lineNumber => $line) {
                  if (! str_contains($line, '->skip(') && ! str_contains($line, 'markTestSkipped(')) {
                      continue;
                  }

                  if (! preg_match('/(?:->skip|markTestSkipped)\(\s*(?:[^,)]*,\s*)?([\'"])(.*?)\1\s*\)/', $line, $matches)) {
                      $violations[] = sprintf('%s:%d must use a literal human-readable skip reason.', $path, $lineNumber + 1);
                      continue;
                  }

                  if (mb_strlen(trim($matches[2])) < 20) {
                      $violations[] = sprintf('%s:%d skip reason must be at least 20 characters.', $path, $lineNumber + 1);
                  }
              }
          }

          if ($violations !== []) {
              fwrite(STDERR, "Skip reason quality check failed:\n".implode("\n", $violations)."\n");
              exit(1);
          }

          echo "Skip reason quality check passed.\n";
          PHP

      - name: Report quarantine tests
        run: |
          echo "Quarantine-tagged tests:"
          if ! grep -R -n -E "->group\\(['\"]quarantine['\"]\\)" tests --include='*.php'; then
            echo "None"
          fi

      - name: Execute tests via Pest
        env:
          DB_CONNECTION: "pgsql"
          DB_DATABASE: "scw__api"
          DB_HOST: "127.0.0.1"
          DB_PORT: 5432
          DB_USERNAME: "scw__api"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: vendor/bin/pest --compact --log-junit junit-pgsql.xml

      - name: Gate skipped tests baseline
        env:
          SKIP_BASELINE: ${{ env.SKIP_BASELINE_PGSQL }}
        run: |
          php <<'PHP'
          <?php
          $junitPath = 'junit-pgsql.xml';
          $xml = simplexml_load_file($junitPath);

          if ($xml === false) {
              fwrite(STDERR, "Unable to read {$junitPath}\n");
              exit(1);
          }

          $skipped = count($xml->xpath('//testcase/skipped'));
          $baseline = (int) getenv('SKIP_BASELINE');

          echo "Skipped tests: {$skipped}; baseline: {$baseline}\n";

          if ($skipped > $baseline) {
              fwrite(STDERR, "Skip gate failed: skipped test count increased above baseline.\n");
              exit(1);
          }
          PHP

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-pgsql
          path: junit-pgsql.xml

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - laravel-test-sqlite
      - laravel-test-pgsql

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
          clean: true

      - name: Set Docker tag
        id: docker-tag
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=develop" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: "${{ runner.os }}-buildx-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: scwiki/api:${{ steps.docker-tag.outputs.tag }}
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
