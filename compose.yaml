services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./storage:/var/www/html/storage
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      CONTAINER_ROLE: queue
      QUEUE_NAME: default
      QUEUE_TRIES: 3
      QUEUE_MAX_JOBS: 20
      QUEUE_SLEEP: 3
    volumes:
      - ./storage:/var/www/html/storage
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal

  queue_expensive:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      CONTAINER_ROLE: queue
      QUEUE_NAME: expensive
      QUEUE_TRIES: 3
      QUEUE_MAX_JOBS: 20
      QUEUE_SLEEP: 3
    volumes:
      - ./storage:/var/www/html/storage
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal

  db:
    image: postgres:16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./var/lib/db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  redis_cache:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - valkey-server
      - --maxmemory
      - "200mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - ./var/lib/redis-cache:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - internal

networks:
  internal:
    driver: bridge
